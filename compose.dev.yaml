services:
  database:
    ports:
      - "${DATABASE_PORT}:5432"
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/backend
      - /backend/node_modules
    ports:
      - "${BACKEND_PORT}:3000"
  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

volumes:
  db_data:
    name: dev