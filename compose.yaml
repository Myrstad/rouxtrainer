services:
    database:
        image: postgres:15-alpine
        restart: unless-stopped
        environment:
            - POSTGRES_DB
            - POSTGRES_USER
            - POSTGRES_PASSWORD
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: production
        restart: unless-stopped
        depends_on:
            database:
                condition: service_healthy
        environment:
            - POSTGRES_DB
            - POSTGRES_USER
            - POSTGRES_PASSWORD
            - POSTGRES_HOST=database
            - POSTGRES_PORT=5432
            - NODE_ENV=production
        ports:
            - "${BACKEND_PORT}:3000"


    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            target: production
        restart: unless-stopped
        ports:
           - "${FRONTEND_PORT}:80"
        depends_on:
            backend:
                condition: service_started

volumes:
    db_data:
        name: production